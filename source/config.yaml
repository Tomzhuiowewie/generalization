paths:
  project_dir: '..'
  csv:
    ras_dir: 'data/csv/ras'
    geo_dir: 'data/csv/geo'
  pt:
    train: 'data/pt/train_prepared.pt'
    validation: 'data/pt/validation_prepared.pt'
    test: 'data/pt/test_prepared.pt'
    normalization: 'data/pt/normalization_scales.pt'
  figure_dir: 'figures'

data:
  max_geo_points: 481

training:
  seed: 2032
  epochs: 100
  pretrain_epochs: 30
  learning_rate: 1.0e-3
  cases_per_batch: 8
  points_per_case: 512
  gradient_clip: 1.0

loss_weights:
  mass: 10.0
  momentum: 1.0e-6

monitor:
  case_count: 16
  time_step: 24
  time_batch: 24
  final_test_time_step: 1

plot:
  contour_levels: 8
